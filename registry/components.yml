# registry/components.yml: what each part of the repository is and which docs describe it (T-83).
# Replaces the retired doc map (frozen copy: tools/impact/tests/fixtures/docmap_565706f.yml). Checked by tools/impact against a built-in schema.
#
# Required per component: id, paths, docs (an explicit [] means "no doc obligation").
# Optional: exclude, generated, interfaces, depends_on, planned, note.
# depends_on: "B depends_on A" means a change to A lists B as a one-hop dependent
# (informational only). Each link states its basis: `code` (seen in the source; give
# `evidence`) or `inferred` (an assumption; give a `note`). Never record a design
# rationale here that a person has not written down.
#
# A doc does not always need to change: a "no change needed" acknowledgement with a
# reason is acceptable (docs/architecture/conventions.md, section 5).
version: 1

components:

  # --- migrated from the retired doc map (entry numbers refer to the frozen copy) ---

  - id: etl-loaders                                   # doc-map entry 1
    paths: ["extractors/**"]
    docs:
      - docs/architecture/etl-workflow.md
      - docs/architecture/system-architecture.md
      - docs/architecture/system-overview.md
      - docs/architecture/database-schema.md
      - docs/architecture/data-contracts.md
    note: database-schema.md cites the loader DDL; the data-contracts.md tables derive from it.

  - id: database-scripts                              # doc-map entry 2
    paths: ["database/**"]
    exclude: ["database/migrations/**"]
    docs:
      - docs/architecture/database-schema.md
      - docs/architecture/data-contracts.md
      - docs/architecture/etl-workflow.md
    note: etl-workflow.md documents the test_connection.py read-only safety gate.

  - id: api-routes                                    # doc-map entry 3
    paths: ["web/src/app/api/**"]
    docs:
      - docs/architecture/data-contracts.md
      - docs/architecture/system-architecture.md
      - docs/architecture/database-schema.md
    interfaces:
      - {path: web/src/app/api/infrastructure/summary/route.ts,  contract: docs/architecture/data-contracts.md}
      - {path: web/src/app/api/infrastructure/features/route.ts, contract: docs/architecture/data-contracts.md}
      - {path: web/src/app/api/infrastructure/stats/route.ts,    contract: docs/architecture/data-contracts.md}
    depends_on:
      - {id: web-lib, basis: code, evidence: "each route.ts imports pool from @/lib/db"}
      - {id: etl-loaders, basis: inferred, note: "the loaders create the tables these routes query; no code link"}
    note: database-schema.md practice queries cite stats/route.ts.

  - id: web-lib                                       # doc-map entry 4
    paths: ["web/src/lib/**"]
    docs: [docs/architecture/system-architecture.md]
    depends_on:
      - {id: web-config, basis: code, evidence: "db.ts imports pg; web/package.json declares pg"}

  - id: web-ui                                        # doc-map entry 5
    paths: ["web/src/components/**", "web/src/app/**"]
    exclude: ["web/src/app/api/**"]
    docs: [docs/architecture/system-architecture.md]
    depends_on:
      - {id: api-routes, basis: code, evidence: "InfrastructureMap.tsx fetches /api/infrastructure/features; InfrastructureDashboard.tsx fetches /api/infrastructure/stats"}
      - {id: web-public, basis: code, evidence: "InfrastructureMap.tsx calls setWorkerUrl('/maplibre-gl-worker.mjs')"}

  - id: web-public                                    # doc-map entry 6
    paths: ["web/public/**"]
    docs: [docs/architecture/system-overview.md]
    note: system-overview.md documents the MapLibre worker in web/public/.

  - id: web-config                                    # doc-map entry 7
    paths: ["web/next.config.ts", "web/package.json"]
    docs:
      - docs/architecture/system-overview.md
      - docs/architecture/system-architecture.md

  - id: db-migrations                                 # doc-map entry 9
    planned: true
    paths: ["database/migrations/**"]
    docs:
      - docs/architecture/database-schema.md
      - docs/architecture/data-contracts.md
    generated: [docs/architecture/generated/schema.md]
    note: Versioned migrations (T-86) and the generated schema doc do not exist yet.

  - id: agent-docs                                    # doc-map entry 10
    paths: ["docs/agents/**"]
    docs: []
    note: Agent and task docs; no code mapping.

  # --- added: paths the retired doc map never covered ---

  - id: python-deps
    paths: ["requirements.txt"]
    docs: [docs/architecture/system-overview.md]
    note: system-overview.md states where Python dependencies are pinned.

  - id: architecture-docs
    paths: ["docs/architecture/**"]
    docs: []

  - id: agent-config
    paths: ["CLAUDE.md", ".claude/**", "web/AGENTS.md"]
    docs: []

  - id: repo-tooling
    paths: [".gitignore", "web/.gitignore", "web/tsconfig.json", "web/eslint.config.mjs",
            "web/package-lock.json", "web/README.md"]
    docs: []

  - id: impact-tool
    paths: ["tools/impact/**", "impact.yml", "registry/**"]
    docs: [docs/architecture/conventions.md]
    note: conventions.md section 5 describes the documentation workflow this tool supports.

content_triggers:

  - id: credential-boundary                           # doc-map entry 8
    paths: ["**/*.py", "web/src/**/*.ts", "web/src/**/*.tsx"]
    match: "DATABASE_URL"
    docs: [docs/architecture/system-architecture.md]
    note: Code that reads DATABASE_URL; check the credential boundary diagram.
