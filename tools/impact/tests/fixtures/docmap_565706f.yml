# docs/doc-map.yml
#
# Maps code paths to the documentation that describes them (T-80).
#
# Purpose: when a branch changes files matching `paths`, the `reviewed` docs must
# be reviewed in the same branch, and any `generated` docs regenerated. This file
# is meant to be read by T-83's docs_impact.py, which is NOT built yet; until then
# it is a checklist for humans and agents.
#
# A doc does not always need to change. A "no change needed" reason in the PR's
# Documentation impact section is acceptable (see
# docs/architecture/conventions.md, section 5).
#
# Fields per entry:
#   paths      glob patterns, relative to the repository root
#   match      optional: only applies when a changed file's content matches this
#              regular expression
#   exclude    optional: glob patterns removed from `paths`
#   reviewed   hand-written docs to review
#   generated  optional: docs produced by a generator (never hand-edited)
#   note       optional: why the mapping exists
#   future     optional: true when the code path does not exist yet

- paths: ["extractors/**"]
  reviewed:
    - docs/architecture/etl-workflow.md
    - docs/architecture/system-architecture.md
    - docs/architecture/system-overview.md
    - docs/architecture/database-schema.md
    - docs/architecture/data-contracts.md
  note: database-schema.md cites the loader DDL; the data-contracts.md tables derive from it.

- paths: ["database/**"]
  exclude: ["database/migrations/**"]
  reviewed:
    - docs/architecture/database-schema.md
    - docs/architecture/data-contracts.md
    - docs/architecture/etl-workflow.md
  note: etl-workflow.md documents the test_connection.py read-only safety gate.

- paths: ["web/src/app/api/**"]
  reviewed:
    - docs/architecture/data-contracts.md
    - docs/architecture/system-architecture.md
    - docs/architecture/database-schema.md
  note: database-schema.md practice queries cite stats/route.ts.

- paths: ["web/src/lib/**"]
  reviewed:
    - docs/architecture/system-architecture.md

- paths: ["web/src/components/**", "web/src/app/**"]
  exclude: ["web/src/app/api/**"]
  reviewed:
    - docs/architecture/system-architecture.md

- paths: ["web/public/**"]
  reviewed:
    - docs/architecture/system-overview.md
  note: system-overview.md documents the MapLibre worker in web/public/.

- paths: ["web/next.config.ts", "web/package.json"]
  reviewed:
    - docs/architecture/system-overview.md
    - docs/architecture/system-architecture.md

- paths: ["**/*.py", "web/src/**/*.ts", "web/src/**/*.tsx"]
  match: "DATABASE_URL"
  reviewed:
    - docs/architecture/system-architecture.md
  note: Code that reads DATABASE_URL; check the credential boundary diagram.

- paths: ["database/migrations/**"]
  future: true
  generated:
    - docs/architecture/generated/schema.md
  reviewed:
    - docs/architecture/database-schema.md
    - docs/architecture/data-contracts.md
  note: Versioned migrations (T-86) and the generated schema doc do not exist yet.

- paths: ["docs/agents/**"]
  reviewed: []
  note: Agent and task docs; no code mapping.
